version: "3.9"

services:
  mysql:
    image: mysql:8.1
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DB: experiment
      APP_PORT: "8080"
    ports:
      - "8080:8080"
